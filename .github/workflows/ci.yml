name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '1.4.0' }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      # Vendored copies must match the owning repo; clone it as a sibling.
      - name: Clone crewly-server
        run: git clone --depth 1 https://github.com/crewly-space/server.git ../server
      - run: bun install
      - run: npm run vendor:check
      - run: bun test
